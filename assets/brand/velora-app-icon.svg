<!-- Velora Clinics — app icon artwork. Export at 1024x1024 to
     assets/images/icon.png when the mark changes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07241F"/><stop offset="0.55" stop-color="#0D3B34"/><stop offset="1" stop-color="#134A40"/>
    </linearGradient>
    <linearGradient id="vein" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DFC163" stop-opacity="0.85"/>
